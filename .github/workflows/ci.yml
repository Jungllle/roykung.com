name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Check formatting with oxfmt
        run: npm run format:check

      - name: Type-check with tsc
        run: npm run check

      - name: Run vitest
        run: npm run test:coverage

      - name: Test build
        run: npm run build

      - name: Smoke-test the built site
        run: npm run test:smoke
